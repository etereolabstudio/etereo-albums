<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etéreo | Memoria Acústica</title>
    <!-- Tus fuentes elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==========================================
         PANTALLA 1: LOGIN (Con tu estilo de tarjeta)
         ========================================== -->
    <div class="card" id="pantalla-login">
        <h1 class="brand-title">Etéreo</h1>
        <p class="status-text">Ingresa tu clave de acceso para desbloquear esta memoria.</p>
        
        <input type="password" id="input-pin" placeholder="PIN" class="pin-input">
        <button id="btn-entrar" class="btn-primary">Desbloquear</button>
        
        <p id="mensaje-error" style="display: none; color: #d63031; font-size: 12px; margin-top: 15px;"></p>
    </div>

    <!-- ==========================================
         PANTALLA 2: REPRODUCTOR SOUNDWAVE / GRABADORA
         ========================================== -->
    <div class="card" id="pantalla-grabacion" style="display: none;">
        <h1 class="brand-title">Etéreo</h1>
        <h2 id="titulo-capitulo" class="chapter-title">Cargando...</h2>
        <p class="status-text" id="status-text">Analizando señal acústica...</p>
        
        <!-- Tu reproductor original[cite: 1] -->
        <div class="waveform-wrapper" id="waveform-wrapper" style="display: none;">
            <canvas id="canvas-base"></canvas>
            <canvas id="canvas-progress"></canvas>
            
            <button class="play-btn" id="custom-play-btn">
                <svg class="icon-play" id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause" id="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>

        <!-- Botones de grabación (Se ocultan si ya hay audio) -->
        <button id="btn-grabar" class="btn-primary" style="margin-top: 20px;">🎤 Grabar Memoria</button>
        <button id="btn-detener" class="btn-secondary" style="display: none; margin-top: 20px;">⏹️ Detener</button>

        <a href="https://etereomx.com" class="back-link">Descubre Etéreo Studio</a>
        <audio id="native-audio"></audio>
    </div>

    <!-- Scripts de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- Tu lógica principal -->
    <script src="app.js"></script>
</body>
</html>
